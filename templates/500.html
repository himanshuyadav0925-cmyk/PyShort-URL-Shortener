{% extends "base.html" %}

{% block title %}500 - Server Error | PyShort{% endblock %}

{% block content %}
<div class="page-wrapper">
    <div class="error-page-container">
        <div class="error-card">
            <div class="error-badge error-badge-danger">500 Server Error</div>
            <div class="error-icon-wrapper">
                <span class="error-icon">⚠️</span>
            </div>
            <h1 class="error-title">Unexpected Server Error</h1>
            <p class="error-message">
                Something went wrong while processing your request. Our system encountered an unexpected condition.
            </p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Return to Dashboard</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
